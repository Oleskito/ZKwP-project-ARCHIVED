<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona główna</title>
    <link rel="stylesheet" href="/Styles/output.css">
</head>
<body>
    <nav class="bg-white shadow-md w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">

                <div class="shrink-0 flex items-center">
                    <a href="/" class="flex items-center gap-3 group">
                        <img src="/Static/logo.png" alt="Logo Psiarnia" class="h-20 w-20 sm:h-25 sm:w-25 object-contain transition-transform group-hover:scale-105">
                        <span class="text-2xl font-bold text-gray-800 group-hover:text-indigo-600 transition-colors">Psiarnia.pl</span>
                    </a>
                </div>

                <div class="flex md:hidden">
                    <button id="mobile-menu-button" type="button" class="text-gray-500 hover:text-gray-900 focus:outline-none focus:text-gray-900" aria-label="Otwórz menu"></button>
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </div>

                <div class="hidden md:flex md:items-center md:space-x-8">
                    <a href="#" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-lg font-semibold tracking-wide transition-colors">
                        Funkcje
                    </a>
                    <a href="#" class="text-gray-700 hover:text-indigo-600 px-3 py-2 text-lg font-semibold tracking-wide transition-colors">
                        Cennik
                    </a>
                </div>

                <div class="hidden lg:block h-8 w-px bg-gray-300"></div>

                <div class="flex items-center space-x-4">
                    <a href="#" class="text-indigo-600 border border-indigo-600 hover:bg-indigo-50 px-5 py-2 rounded-full text-sm font-semibold transition-all">
                        Zaloguj się
                    </a>

                    <a href="registration/" class="bg-indigo-600 text-white hover:bg-indigo-700 hover:shadow-md px-5 py-2 rounded-full text-sm font-semibold transition-all">
                        Zarejestruj się
                    </a>
                </div>

            </div>
        </div>
    </nav>
</body>
</html>
